name: Feature request
description: Something the app should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem first, then the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How you do it today
      description: Workarounds, or how VMware / VirtualBox / Hyper-V Manager handle it.
